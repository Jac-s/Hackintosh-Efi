services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: .env
    environment:
      - DATA_DIR=/app/data
    ports:
      # Local seulement : l'accès distant passe par Tailscale ou un tunnel (voir README.md)
      - "127.0.0.1:20128:20128"
    volumes:
      - omniroute-data:/app/data

volumes:
  omniroute-data:
